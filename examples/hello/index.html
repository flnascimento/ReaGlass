<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  body { font-family: system-ui, sans-serif; background: #1e1e24; color: #eee; margin: 0; padding: 16px; }
  button { background: #3a7bd5; color: #fff; border: 0; padding: 8px 14px; border-radius: 6px; font-size: 14px; cursor: pointer; }
  button:hover { background: #4a8be5; }
  #log { margin-top: 12px; font-family: monospace; font-size: 12px; white-space: pre-wrap; color: #9ecbff; }
</style>
</head>
<body>
  <h2>ReaGlass</h2>
  <p>HTML/CSS/JS dentro do REAPER.</p>
  <button onclick="reaper.send('play', {})">Play</button>
  <button onclick="reaper.send('ping', 'ola do JS')">Ping Lua</button>
  <div id="log"></div>
<script>
  const log = t => document.getElementById('log').textContent += t + '\n';
  reaper.on('pos', p => log('posição: ' + p));
  reaper.on('pong', p => log('Lua respondeu: ' + p));
</script>
</body>
</html>
